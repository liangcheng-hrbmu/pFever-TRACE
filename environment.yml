      - seaborn>=0.13
      - statsmodels>=0.14
      - torch>=2.1
      - tqdm>=4.66
      - xgboost==2.0.3
      - git+https://github.com/dpeerlab/SEACells.git@v0.3.3
      - git+https://github.com/dpeerlab/spectra.git@v0.2.0
