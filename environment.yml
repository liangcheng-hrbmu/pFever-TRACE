      - numpy>=1.26,<2
      - optuna==3.6.0
      - pandas>=2.1
      - scanpy==1.9.8
      - scib-metrics>=0.5,<0.6
      - scikit-learn==1.4.1.post1
      - scipy>=1.11
      - scrublet>=0.2.3
