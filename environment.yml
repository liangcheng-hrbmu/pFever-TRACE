  - pip
  - r-base=4.3
  - r-circlize
  - r-data.table
  - r-dendextend
  - r-dplyr
  - r-ggplot2
  - r-glmnet
  - r-igraph
  - r-jsonlite
  - r-magick
  - r-matrix
  - r-metrics
  - r-nmf
  - r-patchwork
  - r-rlang
  - r-stringr
  - r-tibble
